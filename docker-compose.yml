services:
  onyx-app:
    build: .
    container_name: onyx-ksiegowy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://onyx:${DB_PASSWORD}@onyx-db:5432/onyx_ksiegowy
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GOOGLE_CLOUD_VISION_CREDENTIALS=${GOOGLE_CLOUD_VISION_CREDENTIALS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - UPLOAD_DIR=/app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      onyx-db:
        condition: service_healthy
    restart: unless-stopped

  onyx-db:
    image: postgres:16-alpine
    container_name: onyx-db
    environment:
      - POSTGRES_USER=onyx
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=onyx_ksiegowy
    volumes:
      - onyx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx_ksiegowy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  onyx_pgdata:
  uploads:
