services:
  onyx-app:
    build: .
    container_name: onyx-ksiegowy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://onyx:${DB_PASSWORD}@onyx-db:5432/onyx_ksiegowy
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - UPLOAD_DIR=/app/public/uploads
    volumes:
      - uploads:/app/public/uploads
      - ./secrets:/app/secrets:ro
    depends_on:
      onyx-db:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onyx.entrypoints=websecure"
      - "traefik.http.routers.onyx.rule=Host(`onyx.papishop.pl`)"
      - "traefik.http.routers.onyx.tls.certresolver=letsencrypt"
      - "traefik.http.services.onyx.loadbalancer.server.port=3000"
      - "traefik.docker.network=postgresql-uyof_default"
    restart: unless-stopped

  onyx-db:
    image: postgres:16-alpine
    container_name: onyx-db
    environment:
      - POSTGRES_USER=onyx
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=onyx_ksiegowy
    volumes:
      - onyx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx_ksiegowy"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
    restart: unless-stopped

volumes:
  onyx_pgdata:
  uploads:

networks:
  default:
  traefik:
    external: true
    name: postgresql-uyof_default
